name: Build Docker images

on:
  push:
    branches:
      - master
  schedule:
    - cron: 0 4 * * SUN
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  generic:
    name: Build dependency-free Docker images
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: default

  electrs-multiarch:
    name: Build Electrs on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: electrs

  electrs-merge:
    name: Merge Electrs image
    runs-on: ubuntu-26.04
    needs:
      - electrs-multiarch
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/electrs:latest \
            ghcr.io/1ma/electrs:X64 \
            ghcr.io/1ma/electrs:ARM64

  erlang-multiarch:
    name: Build Erlang ${{ matrix.versions }} on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          - "26.2.5.21"
          - "27.3.4.18"
          - "28.5.0.7"
          - "29.1.1"
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      VERSION: ${{ matrix.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: erlang

  erlang-merge:
    name: Merge Erlang ${{ matrix.major }} image
    runs-on: ubuntu-26.04
    needs:
      - erlang-multiarch
    strategy:
      fail-fast: false
      matrix:
        major:
          - "26"
          - "27"
          - "28"
          - "29"
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/erlang:${{ matrix.major }}-alpine \
            ghcr.io/1ma/erlang:${{ matrix.major }}-X64 \
            ghcr.io/1ma/erlang:${{ matrix.major }}-ARM64

  mempool-multiarch:
    name: Build mempool.guide on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: mempool-guide-backend,mempool-guide-frontend

  mempool-merge:
    name: Merge mempool.guide images
    runs-on: ubuntu-26.04
    needs:
      - mempool-multiarch
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/mempool.guide:backend \
            ghcr.io/1ma/mempool.guide:backend-X64 \
            ghcr.io/1ma/mempool.guide:backend-ARM64
          docker buildx imagetools create \
            -t 1maa/mempool.guide:frontend \
            ghcr.io/1ma/mempool.guide:frontend-X64 \
            ghcr.io/1ma/mempool.guide:frontend-ARM64

  php-multiarch:
    name: Build PHP ${{ matrix.versions }} on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          - "8.2.34"
          - "8.3.35"
          - "8.4.26"
          - "8.5.11"
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      VERSION: ${{ matrix.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: php

  php-merge:
    name: Merge PHP ${{ matrix.versions }} image
    runs-on: ubuntu-26.04
    needs:
      - php-multiarch
    strategy:
      fail-fast: false
      matrix:
        versions:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/php:${{ matrix.versions }} \
            ghcr.io/1ma/php:${{ matrix.versions }}-X64 \
            ghcr.io/1ma/php:${{ matrix.versions }}-ARM64

  postgres-multiarch:
    name: Build Postgres ${{ matrix.versions }} on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          - "13.23"
          - "14.24"
          - "15.19"
          - "16.15"
          - "17.11"
          - "18.6"
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      VERSION: ${{ matrix.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: postgres

  postgres-merge:
    name: Merge Postgres ${{ matrix.major }} image
    runs-on: ubuntu-26.04
    needs:
      - postgres-multiarch
    strategy:
      fail-fast: false
      matrix:
        major:
          - "13"
          - "14"
          - "15"
          - "16"
          - "17"
          - "18"
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/postgres:${{ matrix.major }}-alpine \
            ghcr.io/1ma/postgres:${{ matrix.major }}-alpine-X64 \
            ghcr.io/1ma/postgres:${{ matrix.major }}-alpine-ARM64

  sqlite-multiarch:
    name: Build SQLite on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: sqlite

  sqlite-merge:
    name: Merge SQLite image
    runs-on: ubuntu-26.04
    needs:
      - sqlite-multiarch
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/sqlite:latest \
            ghcr.io/1ma/sqlite:latest-X64 \
            ghcr.io/1ma/sqlite:latest-ARM64

  ghcr-cleanup:
    name: Cleanup stale GHCR images
    runs-on: ubuntu-26.04
    needs:
      - electrs-merge
      - erlang-merge
      - mempool-merge
      - php-merge
      - postgres-merge
      - sqlite-merge
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: electrs
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: erlang
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: mempool.guide
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: php
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: postgres
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: sqlite
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
