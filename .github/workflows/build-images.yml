name: Build Docker images

on:
  push:
    branches:
      - master
  schedule:
    - cron: 0 4 * * SUN
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  generic:
    name: Build dependency-free Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          provenance: false
          push: true
          sbom: false
          targets: default

  cln-alpine:
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: cln-alpine
      tag: alpine
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  cln-debian:
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: cln-debian
      tag: debian
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  electrs:
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: electrs
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  erlang:
    strategy:
      fail-fast: false
      matrix:
        variants:
          - ["26", "26.2.5.21"]
          - ["27", "27.3.4.14"]
          - ["28", "28.5.0.3"]
          - ["29", "29.0.3"]
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: erlang
      tag: ${{ matrix.variants[0] }}
      version: ${{ matrix.variants[1] }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  php:
    strategy:
      fail-fast: false
      matrix:
        variants:
          - ["8.2", "8.2.32"]
          - ["8.3", "8.3.32"]
          - ["8.4", "8.4.23"]
          - ["8.5", "8.5.8"]
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: php
      tag: ${{ matrix.variants[0] }}
      version: ${{ matrix.variants[1] }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  postgres:
    strategy:
      fail-fast: false
      matrix:
        variants:
          - ["13-alpine", "13.23"]
          - ["14-alpine", "14.23"]
          - ["15-alpine", "15.18"]
          - ["16-alpine", "16.14"]
          - ["17-alpine", "17.10"]
          - ["18-alpine", "18.4"]
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: postgres
      tag: ${{ matrix.variants[0] }}
      version: ${{ matrix.variants[1] }}
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}

  sqlite:
    uses: ./.github/workflows/multiarch-build.yml
    with:
      target: sqlite
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      hub_token: ${{ secrets.DOCKER_HUB_PASS }}
