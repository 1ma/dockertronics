name: mempool.guide

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/mempool.guide.yml"
      - "mempool.guide/**"
  schedule:
    - cron: 0 4 * * SUN
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build mempool.guide ${{ matrix.branch }} branch on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
        branch:
          - "master"
          - "poolcoin"
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          MEMPOOL_BRANCH: ${{ matrix.branch }}
        with:
          files: mempool.guide/docker-bake.hcl
          provenance: false
          push: true
          sbom: false
          targets: mempool-guide-backend,mempool-guide-frontend

  merge:
    name: Merge mempool.guide images
    runs-on: ubuntu-26.04
    needs:
      - build
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/mempool.guide:blakecoin-backend \
            ghcr.io/1ma/mempool.guide:master-backend-X64 \
            ghcr.io/1ma/mempool.guide:master-backend-ARM64
          docker buildx imagetools create \
            -t 1maa/mempool.guide:poolcoin-backend \
            -t 1maa/mempool.guide:backend \
            ghcr.io/1ma/mempool.guide:poolcoin-backend-X64 \
            ghcr.io/1ma/mempool.guide:poolcoin-backend-ARM64
          docker buildx imagetools create \
            -t 1maa/mempool.guide:blakecoin-frontend \
            ghcr.io/1ma/mempool.guide:master-frontend-X64 \
            ghcr.io/1ma/mempool.guide:master-frontend-ARM64
          docker buildx imagetools create \
            -t 1maa/mempool.guide:poolcoin-frontend \
            -t 1maa/mempool.guide:frontend \
            ghcr.io/1ma/mempool.guide:poolcoin-frontend-X64 \
            ghcr.io/1ma/mempool.guide:poolcoin-frontend-ARM64

  cleanup:
    name: Cleanup stale mempool.guide images in GHCR
    runs-on: ubuntu-26.04
    needs:
      - merge
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: mempool.guide
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
