name: postgres

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/postgres.yml"
      - "postgres/**"
  schedule:
    - cron: 0 4 * * SUN
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Postgres ${{ matrix.versions }} on ${{ matrix.runners }}
    runs-on: ${{ matrix.runners }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          - "13.23"
          - "14.24"
          - "15.19"
          - "16.15"
          - "17.11"
          - "18.6"
        runners:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
    env:
      VERSION: ${{ matrix.versions }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: postgres/docker-bake.hcl
          provenance: false
          push: true
          sbom: false
          targets: postgres

  merge:
    name: Merge Postgres ${{ matrix.major }} image
    runs-on: ubuntu-26.04
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        major:
          - "13"
          - "14"
          - "15"
          - "16"
          - "17"
          - "18"
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: 1maa
          password: ${{ secrets.DOCKER_HUB_PASS }}
      - run: |
          docker buildx imagetools create \
            -t 1maa/postgres:${{ matrix.major }}-alpine \
            ghcr.io/1ma/postgres:${{ matrix.major }}-alpine-X64 \
            ghcr.io/1ma/postgres:${{ matrix.major }}-alpine-ARM64

  cleanup:
    name: Cleanup stale Postgres images in GHCR
    runs-on: ubuntu-26.04
    needs:
      - merge
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: postgres
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
